# Облачная сборка «Просто ТВ»: тесты ядра и приложения, затем подписанный релизный APK.
name: Simple TV APK

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
  # Ручной запуск. Адрес плейлиста здесь не задаётся: он попал бы в APK
  # и в историю запусков, поэтому вшивается только при локальной сборке.
  workflow_dispatch:

concurrency:
  group: simple-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Тесты ядра и приложения
        run: ./gradlew :engine:testDebugUnitTest :app:tv:testDebugUnitTest

      # Постоянный ключ подписи берётся из секретов: APK с другим ключом
      # не встанет поверх версии, уже установленной на приставке.
      - name: Ключ подписи
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Не задан секрет RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Релизный APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:tv:assembleRelease

      # Без FFmpeg часть каналов останется без звука (MP2), поэтому проверяем его наличие.
      - name: FFmpeg внутри APK
        run: unzip -l app/tv/build/outputs/apk/release/tv-*-release.apk | grep -q 'lib/arm64-v8a/libavcodec.so'

      - uses: actions/upload-artifact@v7
        with:
          name: simple-tv-apk
          if-no-files-found: error
          path: app/tv/build/outputs/apk/release/tv-*-release.apk
