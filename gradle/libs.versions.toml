# Каталог зависимостей «Просто ТВ». Версии меняются только здесь,
# в скриптах модулей библиотеки подключаются по коротким именам ниже.

[versions]
agp = "9.1.1"
kotlin = "2.4.10"
ksp = "2.3.10"
coroutines = "1.10.2"
activity = "1.12.3"
lifecycle = "2.10.0"
work = "2.11.1"
room = "2.8.4"
datastore = "1.1.7"
hilt = "2.59.2"
hilt-androidx = "1.3.0"
compose-bom = "2026.06.01"
tv-material = "1.1.0-alpha01"
media3 = "1.11.1"
nextlib = "1.11.1-0.16.0"
okhttp = "4.12.0"
coil = "2.7.0"

[libraries]
# Kotlin
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

# Android: окно, жизненный цикл, фоновые задачи, хранение
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Внедрение зависимостей
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hilt-androidx" }
hilt-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hilt-androidx" }
hilt-androidx-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-androidx" }

# Интерфейс для телевизора
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Плеер и сеть
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3" }
media3-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
nextlib-ffmpeg = { module = "io.github.anilbeesetti:nextlib-media3ext", version.ref = "nextlib" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
