# Сборка «Просто ТВ» на GitLab (зеркало репозитория с GitHub).
# Тесты и релизный APK без ключа подписи: постоянный ключ хранится только
# в секретах GitHub. Для метки версии сборка дополнительно сверяется
# с подписанным APK из релиза — он должен совпасть до байта (кроме подписи).

image: eclipse-temurin:17-jdk

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  CMDLINE_TOOLS: "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"

cache:
  key: android-sdk-37
  paths:
    - .android-sdk/
    - .gradle-home/caches/
    - .gradle-home/wrapper/

apk:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip wget python3-pip >/dev/null
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        wget -q "$CMDLINE_TOOLS" -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null'
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon :engine:testDebugUnitTest :app:tv:testDebugUnitTest
    - ./gradlew --no-daemon :app:tv:assembleRelease
    # Без FFmpeg часть каналов останется без звука (MP2, AC3), поэтому проверяем его наличие.
    - unzip -l app/tv/build/outputs/apk/release/tv-*-release-unsigned.apk | grep -q 'lib/arm64-v8a/libavcodec.so'
    # Для метки версии: наша сборка должна совпасть с подписанным APK из релиза.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        wget -q "https://github.com/uladzemer/IPTV-Simple-Player/releases/download/$CI_COMMIT_TAG/SimpleTV-$VERSION.apk" -O signed.apk
        pip3 install -q --break-system-packages apksigcopier
        export PATH="$ANDROID_HOME/build-tools/37.0.0:$PATH"
        apksigcopier compare signed.apk --unsigned "app/tv/build/outputs/apk/release/tv-$VERSION-release-unsigned.apk"
        echo "Сборка совпадает с подписанным APK из релиза $CI_COMMIT_TAG"
      fi
  artifacts:
    name: "simple-tv-$CI_COMMIT_REF_SLUG"
    paths:
      - app/tv/build/outputs/apk/release/*.apk
    expire_in: 30 days
